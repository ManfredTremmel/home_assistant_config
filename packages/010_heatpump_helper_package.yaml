# ###################### HA Heat Pump automation helpers #####################
#
# (C) 2025-2026 Manfred Tremmel
#
# Some helper automations 
#
# Dependencies:
#       "Solar Forecast ML" extension from HACS
#       "RCT Power" extension from HACS
#
# Used entities:
#       sensor.rct_power_storage_grid_power
#       binary_sensor.heating_pump_heating_mode
#       binary_sensor.heating_pump_party_mode
#       select.mosquitto_broker_betriebsart
#       sensor.mosquitto_broker_warmwassertemperatur_oben
#       number.mosquitto_broker_warmwassersolltemperatur_2
#
# Provided entities:
#       none
#
automation heating_pump_helpers:

  #
  # When one time hot water generation is active and target temperature is reached,
  # turn it off.
  #
  - id: 'heating_pump_deactivate_hot_water'
    alias: 'Einmal Warmwasseraufbereitung beenden, wenn Zieltemperatur erreicht'
    description: 'Sobald die eingestellte Zieltemperatur erreicht wurde, Aufbereitung stoppen'
    triggers:
      - trigger: numeric_state
        entity_id:
        - sensor.mosquitto_broker_warmwassertemperatur_oben
        above: number.mosquitto_broker_warmwassersolltemperatur_2
    conditions:
      - condition: state
        entity_id: switch.mosquitto_broker_einmal_ww_bereitung
        state: 'on'
    actions:
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: switch.mosquitto_broker_einmal_ww_bereitung
    mode: single

  #
  # At 12:15 PM turn on one time hot water generation, when temperature is below 40 ℃ and
  # valve is in heating stage.
  #
  - id: 'heating_pump_activate_hot_water'
    alias: 'Wärmepumpe einmal Warmwasseraufbereitung im Party Modus aktivieren'
    description: 'Um 12:15 Uhr Warmwasseraufbereitung starten, wenn der Tank unter 40 Grad warm ist'
    triggers:
      - trigger: time
        at: '12:15:00'
    conditions:
      - condition: numeric_state
        entity_id: sensor.mosquitto_broker_warmwassertemperatur_oben
        below: 40
      - condition: state
        entity_id: binary_sensor.heating_pump_party_mode
        state: 'on'
      - condition: state
        entity_id: binary_sensor.mosquitto_broker_status_warmwasserventil
        state: 'off'
    actions:
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: switch.mosquitto_broker_einmal_ww_bereitung
    mode: single
